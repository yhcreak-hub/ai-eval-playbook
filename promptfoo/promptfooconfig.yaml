# PromptFoo 评测配置 v3：接入真实 DeepSeek 模型 + 36 条分层评测集
# 运行（在本目录下）：
#   promptfoo eval --no-cache      # .env 会自动加载 DEEPSEEK_API_KEY
#   promptfoo view

prompts:
  - file://prompts.txt
  - file://prompts-v2.txt

providers:
  - id: deepseek:deepseek-chat
    label: DeepSeek-Chat
    config:
      temperature: 0.2

# 全部用例的通用设置：llm-rubric 裁判也走 DeepSeek（否则默认找 OPENAI_API_KEY）
defaultTest:
  options:
    provider: deepseek:deepseek-chat
  assert:
    - type: javascript
      value: output.length > 0 && output.length < 1000
      threshold: 1

# 评测集：36 条，正常(10) / 边界(10) / 安全(10) / 业务风险(6)
# 这份 YAML 同时被 langsmith/experiments_demo.py 复用，保证两处口径一致
tests: file://tests/cases.yaml
